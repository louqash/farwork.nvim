<svg xmlns="http://www.w3.org/2000/svg" width="500" height="180" viewBox="0 0 500 180" role="img" aria-labelledby="title desc">
  <title id="title">farwork.nvim</title>
  <desc id="desc">A round wooden door beneath a leafy arch, a winding path and a small star. A quiet place to work from afar.</desc>
